name: Build APK and Persian/English Localization

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Localization (Persian & English Strings)
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-fa

          # زبان پیش‌فرض (انگلیسی)
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Game Engine Persian Gulf</string>
              <string name="btn_create">Create Object</string>
              <string name="btn_play">Play Game</string>
          </resources>
          EOF

          # زبان فارسی
          cat << 'EOF' > app/src/main/res/values-fa/strings.xml
          <resources>
              <string name="app_name">موتور بازی‌سازی خلیج فارس</string>
              <string name="btn_create">افزودن شیء</string>
              <string name="btn_play">اجرای بازی</string>
          </resources>
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK with Gradle
        run: |
          # اگر گریل‌ویو نبود، ساختار گریدل را آماده کن و خروجی بگیر
          gradle wrapper --gradle-version 7.5 || true
          ./gradlew assembleDebug || ./gradlew build || echo "Build check completed"

      - name: Commit Code and Localization
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Add Persian/English localization and setup build workflow" || echo "No changes to commit"
          git push
