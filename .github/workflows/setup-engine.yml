name: Setup Android Native Engine

on:
  workflow_dispatch: # اجازه اجرای دستی از تب Actions در گیت‌هاب

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Directories and Files
        run: |
          # ساخت پوشه‌های اندروید استودیو برای کاتلین
          mkdir -p app/src/main/java/com/persiangulf/gameengine/model
          mkdir -p app/src/main/java/com/persiangulf/gameengine/engine

          # ۱. ساخت فایل GameObject.kt
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/model/GameObject.kt
          package com.persiangulf.gameengine.model

          data class GameObject(
              var id: String,
              var name: String,
              var type: String, // 'player', 'platform', 'enemy', 'coin', 'goal'
              var x: Float,
              var y: Float,
              var width: Float,
              var height: Float,
              var color: String,
              var speed: Float = 200f,
              var jumpPower: Float = 500f,
              var health: Int = 3
          )
          EOF

          # تنظیمات گیت برای ذخیره تغییرات
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add app/
          git commit -m "Auto-generate Android native engine structure (GameObject.kt)" || echo "No changes to commit"
          git push
