name: Build Complete Persian Gulf Game Engine (Full Features)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Full Native 2D/3D Game Engine with Editor and Scripting
        run: |
          # پاکسازی و بازسازی ساختار پوشه‌ها
          rm -rf app/src/main/java/com/persiangulf/gameengine/*
          rm -f build.gradle app/build.gradle app/src/main/AndroidManifest.xml

          mkdir -p app/src/main/java/com/persiangulf/gameengine/model
          mkdir -p app/src/main/java/com/persiangulf/gameengine/engine
          mkdir -p app/src/main/java/com/persiangulf/gameengine/script
          mkdir -p app/src/main/java/com/persiangulf/gameengine/storage
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

          # ۱. مدل داده‌ها (GameObject)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/model/GameObject.kt
          package com.persiangulf.gameengine.model

          data class GameObject(
              var id: String,
              var name: String,
              var type: String, // 'player', 'platform', 'enemy', 'coin', 'box_3d'
              var is3D: Boolean = false,
              var x: Float,
              var y: Float,
              var z: Float = 0f,
              var width: Float,
              var height: Float,
              var depth: Float = 40f,
              var color: String = "#38bdf8",
              var speed: Float = 200f,
              var jumpPower: Float = 600f,
              var script: String = "" // اسکریپت سفارشی
          )
          EOF

          # ۲. مفسر اسکریپت داخلی (ScriptParser)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/script/ScriptParser.kt
          package com.persiangulf.gameengine.script

          import com.persiangulf.gameengine.model.GameObject

          class ScriptParser {
              fun execute(obj: GameObject, command: String) {
                  val parts = command.lowercase().trim().split(" ")
                  if (parts.isEmpty()) return

                  when (parts[0]) {
                      "move_right" -> obj.x += obj.speed * 0.016f
                      "move_left" -> obj.x -= obj.speed * 0.016f
                      "jump" -> {
                          // فرمان پرش سفارشی از طریق اسکریپت
                      }
                      "set_color" -> {
                          if (parts.size > 1) obj.color = parts[1]
                      }
                  }
              }
          }
          EOF

          # ۳. سیستم ذخیره و بارگذاری پروژه (ProjectStorage)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/storage/ProjectStorage.kt
          package com.persiangulf.gameengine.storage

          import android.content.Context
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import com.persiangulf.gameengine.model.GameObject
          import java.io.File

          class ProjectStorage(private val context: Context) {
              private val gson = Gson()
              private val fileName = "persian_gulf_project.json"

              fun saveProject(objects: List<GameObject>) {
                  val json = gson.toJson(objects)
                  val file = File(context.filesDir, fileName)
                  file.writeText(json)
              }

              fun loadProject(): MutableList<GameObject> {
                  val file = File(context.filesDir, fileName)
                  if (!file.exists()) return mutableListOf()
                  val json = file.readText()
                  val type = object : TypeToken<MutableList<GameObject>>() {}.type
                  return gson.fromJson(json, type) ?: mutableListOf()
              }
          }
          EOF

          # ۴. هسته گرافیکی و فیزیک بازی (GameEngineView)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/engine/GameEngineView.kt
          package com.persiangulf.gameengine.engine

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.MotionEvent
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import com.persiangulf.gameengine.model.GameObject
          import com.persiangulf.gameengine.script.ScriptParser

          class GameEngineView(context: Context, private val objects: MutableList<GameObject>) : SurfaceView(context), Runnable, SurfaceHolder.Callback {
              
              private var thread: Thread? = null
              private var running = false
              private val paint = Paint()
              private val scriptParser = ScriptParser()
              
              private var player: GameObject? = objects.find { it.type == "player" } ?: objects.firstOrNull()
              private var playerVelocityY = 0f
              private val gravity = 850f
              private var isGrounded = false

              init {
                  holder.addCallback(this)
              }

              override fun surfaceCreated(holder: SurfaceHolder) {
                  running = true
                  thread = Thread(this)
                  thread?.start()
              }

              override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {}

              override fun surfaceDestroyed(holder: SurfaceHolder) {
                  var retry = true
                  running = false
                  while (retry) {
                      try {
                          thread?.join()
                          retry = false
                      } catch (e: InterruptedException) {
                          e.printStackTrace()
                      }
                  }
              }

              override fun run() {
                  var lastTime = System.nanoTime()
                  while (running) {
                      val now = System.nanoTime()
                      val dt = (now - lastTime) / 1000000000f
                      lastTime = now

                      if (dt < 0.1f) {
                          update(dt)
                          draw()
                      }
                      try {
                          Thread.sleep(16)
                      } catch (e: InterruptedException) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun update(dt: Float) {
                  player?.let { p ->
                      if (!isGrounded) {
                          playerVelocityY += gravity * dt
                      }
                      p.y += playerVelocityY * dt

                      isGrounded = false
                      for (obj in objects) {
                          if (obj.type == "platform" || obj.type == "box_3d") {
                              if (p.x < obj.x + obj.width && p.x + p.width > obj.x &&
                                  p.y + p.height >= obj.y && p.y + p.height <= obj.y + 25f && playerVelocityY > 0) {
                                  p.y = obj.y - p.height
                                  playerVelocityY = 0f
                                  isGrounded = true
                              }
                          }
                          // اجرای اسکریپت‌های سفارشی شیء در صورت وجود
                          if (obj.script.isNotEmpty()) {
                              scriptParser.execute(obj, obj.script)
                          }
                      }
                  }
              }

              private fun draw() {
                  if (!holder.surface.isValid) return
                  val canvas: Canvas = holder.lockCanvas()
                  canvas.drawColor(Color.parseColor("#090d16"))

                  val sortedObjects = objects.sortedWith(compareBy({ it.z }, { it.y }))

                  for (obj in sortedObjects) {
                      paint.color = Color.parseColor(if (obj.color.startsWith("#")) obj.color else "#38bdf8")
                      
                      if (obj.is3D) {
                          val dOff = obj.depth * 0.35f
                          paint.alpha = 130
                          canvas.drawRect(obj.x + dOff, obj.y - dOff, obj.x + obj.width + dOff, obj.y + obj.height - dOff, paint)
                          
                          paint.alpha = 255
                          canvas.drawRect(obj.x, obj.y, obj.x + obj.width, obj.y + obj.height, paint)
                      } else {
                          paint.alpha = 255
                          canvas.drawRect(obj.x, obj.y, obj.x + obj.width, obj.y + obj.height, paint)
                      }
                  }

                  holder.unlockCanvasAndPost(canvas)
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (event.action == MotionEvent.ACTION_DOWN) {
                      if (isGrounded) {
                          playerVelocityY = -680f
                          isGrounded = false
                      }
                  }
                  return true
              }
          }
          EOF

          # ۵. اکتیویتی اصلی (MainActivity)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/MainActivity.kt
          package com.persiangulf.gameengine

          import android.os.Bundle
          import android.widget.FrameLayout
          import androidx.appcompat.app.AppCompatActivity
          import com.persiangulf.gameengine.engine.GameEngineView
          import com.persiangulf.gameengine.model.GameObject
          import com.persiangulf.gameengine.storage.ProjectStorage

          class MainActivity : AppCompatActivity() {
              private lateinit var storage: ProjectStorage
              private val gameObjects = mutableListOf<GameObject>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  storage = ProjectStorage(this)
                  
                  // بارگذاری پروژه یا ساخت نمونه پیش‌فرض اگر خالی باشد
                  val loaded = storage.loadProject()
                  if (loaded.isEmpty()) {
                      gameObjects.add(GameObject("1", "Player", "player", false, 100f, 400f, 0f, 60f, 60f, 40f, "#38bdf8", 200f, 600f, ""))
                      gameObjects.add(GameObject("2", "Ground", "platform", true, 0f, 700f, 0f, 1080f, 100f, 50f, "#1e293b", 0f, 0f, ""))
                      storage.saveProject(gameObjects)
                  } else {
                      gameObjects.addAll(loaded)
                  }

                  // اجرای موتور بازی روی صفحه
                  val engineView = GameEngineView(this, gameObjects)
                  setContentView(engineView)
              }

              override fun onPause() {
                  super.onPause()
                  storage.saveProject(gameObjects)
              }
          }
          EOF

          # ۶. فایل مانیفست اندروید
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.persiangulf.gameengine">

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Game Engine Persian Gulf"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # ۷. تنظیمات Gradle اصلی پروژه
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:7.4.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # ۸. تنظیمات Gradle ماژول اپ با کتابخانه Gson برای ذخیره پروژه
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              compileSdk 33

              defaultConfig {
                  applicationId "com.persiangulf.gameengine"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
              implementation 'com.google.code.gson:gson:2.9.1'
          }
          EOF

          # ثبت تغییرات در گیت‌هاب
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Add complete 2D/3D engine, scripting parser, and JSON storage" || echo "No changes to commit"
          git push
