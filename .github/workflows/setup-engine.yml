name: Upgrade Pars Game Engine - Module 5 (Enemy AI & Advanced Physics)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Upgrade Pars Game Engine Project
        run: |
          mkdir -p app/src/main/java/com/persiangulf/gameengine/model
          mkdir -p app/src/main/java/com/persiangulf/gameengine/engine
          mkdir -p app/src/main/java/com/persiangulf/gameengine/storage
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:color="#090d16"/>
              <foreground android:color="#38bdf8"/>
          </adaptive-icon>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:color="#090d16"/>
              <foreground android:color="#38bdf8"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Pars Game Engine 3D</string>
          </resources>
          EOF

          # ۱. مدل ذرات (Particle)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/model/Particle.kt
          package com.persiangulf.gameengine.model

          data class Particle(
              var x: Float,
              var y: Float,
              var vx: Float,
              var vy: Float,
              var colorHex: String = "#facc15",
              var life: Float = 1.0f
          )
          EOF

          # ۲. مدل داده اشیاء و کاراکترها در موتور پارس (GameObject3D)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/model/GameObject3D.kt
          package com.persiangulf.gameengine.model

          data class GameObject3D(
              var id: String,
              var name: String,
              var type: String = "cube", // player, enemy, house, tree
              var x: Float = 0f,
              var y: Float = 0f,
              var z: Float = 0f,
              var scaleX: Float = 1f,
              var scaleY: Float = 1f,
              var scaleZ: Float = 1f,
              var colorHex: String = "#38bdf8",
              var hasGravity: Boolean = true,
              var health: Int = 100,
              var maxHealth: Int = 100,
              var velocityY: Float = 0f,
              var isWalking: Boolean = false,
              var animFrame: Float = 0f,
              var isDead: Boolean = false
          )
          EOF

          # ۳. ذخیره‌سازی پروژه پارس
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/storage/ProjectStorage.kt
          package com.persiangulf.gameengine.storage

          import android.content.Context
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import com.persiangulf.gameengine.model.GameObject3D
          import java.io.File

          class ProjectStorage(private val context: Context) {
              private val gson = Gson()
              private val fileName = "pars_engine_3d_project.json"

              fun saveProject(objects: List<GameObject3D>) {
                  val json = gson.toJson(objects)
                  File(context.filesDir, fileName).writeText(json)
              }

              fun loadProject(): MutableList<GameObject3D> {
                  val file = File(context.filesDir, fileName)
                  if (!file.exists()) return mutableListOf()
                  val type = object : TypeToken<MutableList<GameObject3D>>() {}.type
                  return gson.fromJson(file.readText(), type) ?: mutableListOf()
              }
          }
          EOF

          # ۴. هسته گرافیکی، فیزیک و هوش مصنوعی موتور پارس (EngineViewport)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/engine/EngineViewport.kt
          package com.persiangulf.gameengine.engine

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.MotionEvent
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import com.persiangulf.gameengine.model.GameObject3D
          import com.persiangulf.gameengine.model.Particle
          import kotlin.math.abs
          import kotlin.math.sin

          class EngineViewport(context: Context, val objects: MutableList<GameObject3D>) : SurfaceView(context), Runnable, SurfaceHolder.Callback {
              private var thread: Thread? = null
              private var running = false
              private val paint = Paint()
              var selectedObject: GameObject3D? = null
              private var lastTouchX = 0f
              private var lastTouchY = 0f
              var isPlayMode = false
              
              val particles = mutableListOf<Particle>()
              var cameraOffsetX = 0f

              init { holder.addCallback(this) }

              override fun surfaceCreated(holder: SurfaceHolder) {
                  running = true
                  thread = Thread(this)
                  thread?.start()
              }
              override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {}
              override fun surfaceDestroyed(holder: SurfaceHolder) {
                  running = false
                  try { thread?.join() } catch (e: InterruptedException) { e.printStackTrace() }
              }

              fun movePlayer(dir: Float) {
                  val player = objects.find { it.type == "player" } ?: return
                  player.x += dir * 10f
                  player.isWalking = true
                  player.animFrame += 0.2f
              }

              fun stopPlayer() {
                  val player = objects.find { it.type == "player" } ?: return
                  player.isWalking = false
              }

              fun jumpPlayer() {
                  val player = objects.find { it.type == "player" } ?: return
                  if (player.y >= 500f) {
                      player.velocityY = -600f
                  }
              }

              fun attackEnemy() {
                  val player = objects.find { it.type == "player" } ?: return
                  for (obj in objects) {
                      if (obj.type == "enemy" && !obj.isDead && abs(obj.x - player.x) < 120f) {
                          obj.health -= 35
                          spawnBloodFx(obj.x, obj.y)
                          if (obj.health <= 0) {
                              obj.isDead = true
                              obj.health = 0
                          }
                      }
                  }
              }

              private fun spawnBloodFx(x: Float, y: Float) {
                  for (i in 0..12) {
                      particles.add(
                          Particle(
                              x, y,
                              (-200..200).random().toFloat(),
                              (-200..200).random().toFloat(),
                              "#dc2626"
                          )
                      )
                  }
              }

              override fun run() {
                  var lastTime = System.nanoTime()
                  while (running) {
                      val now = System.nanoTime()
                      val dt = (now - lastTime) / 1000000000f
                      lastTime = now
                      if (dt < 0.1f) {
                          if (isPlayMode) updateAIAndPhysics(dt)
                          updateParticles(dt)
                          drawScene()
                      }
                      try { Thread.sleep(16) } catch (e: InterruptedException) { e.printStackTrace() }
                  }
              }

              private fun updateAIAndPhysics(dt: Float) {
                  val player = objects.find { it.type == "player" }
                  player?.let { p ->
                      cameraOffsetX = p.x - 400f

                      // هوش مصنوعی دشمنان (Enemy AI)
                      for (obj in objects) {
                          if (obj.type == "enemy" && !obj.isDead) {
                              val dist = p.x - obj.x
                              if (abs(dist) in 10f..400f) {
                                  val dir = if (dist > 0) 1f else -1f
                                  obj.x += dir * 3f
                                  obj.isWalking = true
                                  obj.animFrame += 0.15f
                              } else {
                                  obj.isWalking = false
                              }
                          }
                      }
                  }

                  // فیزیک جاذبه
                  for (obj in objects) {
                      if (obj.hasGravity && obj.y < 500f) {
                          obj.velocityY += 980f * dt
                          obj.y += obj.velocityY * dt
                          if (obj.y >= 500f) {
                              obj.y = 500f
                              obj.velocityY = 0f
                          }
                      }
                  }
              }

              private fun updateParticles(dt: Float) {
                  val pIter = particles.iterator()
                  while (pIter.hasNext()) {
                      val p = pIter.next()
                      p.x += p.vx * dt
                      p.y += p.vy * dt
                      p.life -= dt * 2.5f
                      if (p.life <= 0f) pIter.remove()
                  }
              }

              private fun drawScene() {
                  if (!holder.surface.isValid) return
                  val canvas: Canvas = holder.lockCanvas()
                  canvas.drawColor(Color.parseColor("#090d16"))

                  // ۱. زمین و خطوط
                  paint.color = Color.parseColor("#1e293b")
                  paint.strokeWidth = 2f
                  for (i in -1000..4000 step 100) {
                      val screenX = i.toFloat() - cameraOffsetX
                      canvas.drawLine(screenX, 0f, screenX, 2000f, paint)
                  }
                  
                  paint.color = Color.parseColor("#15803d")
                  paint.strokeWidth = 8f
                  canvas.drawLine(-1000f - cameraOffsetX, 590f, 4000f - cameraOffsetX, 590f, paint)

                  // ۲. رندر ذرات
                  for (p in particles) {
                      paint.color = Color.parseColor(p.colorHex)
                      paint.alpha = (p.life * 255).toInt().coerceIn(0, 255)
                      canvas.drawCircle(p.x - cameraOffsetX, p.y, 7f * p.life, paint)
                  }

                  // ۳. رندر اشیاء و کاراکترها
                  for (obj in objects) {
                      val rx = obj.x - cameraOffsetX
                      val ry = obj.y

                      when (obj.type) {
                          "player" -> drawCharacter(canvas, rx, ry, obj, "#38bdf8")
                          "enemy" -> {
                              if (obj.isDead) {
                                  // رسم کاراکتر افتاده روی زمین
                                  paint.color = Color.parseColor("#991b1b")
                                  canvas.drawRect(rx - 30f, 580f, rx + 30f, 590f, paint)
                              } else {
                                  drawCharacter(canvas, rx, ry, obj, "#ef4444")
                              }
                          }
                          "house" -> drawHouse(canvas, rx, ry)
                          else -> {
                              paint.color = Color.parseColor(obj.colorHex)
                              canvas.drawRect(rx, ry, rx + (80f * obj.scaleX), ry + (80f * obj.scaleY), paint)
                          }
                      }
                  }
                  holder.unlockCanvasAndPost(canvas)
              }

              private fun drawCharacter(canvas: Canvas, x: Float, y: Float, obj: GameObject3D, color: String) {
                  val legAngle = if (obj.isWalking) sin(obj.animFrame.toDouble()).toFloat() * 25f else 0f

                  // سایه
                  paint.color = Color.BLACK
                  paint.alpha = 80
                  canvas.drawOval(x - 25f, 585f, x + 25f, 598f, paint)

                  // پاها
                  paint.color = Color.parseColor("#0f172a")
                  paint.strokeWidth = 8f
                  paint.alpha = 255
                  canvas.drawLine(x - 8f, y + 30f, x - 8f + legAngle, y + 80f, paint)
                  canvas.drawLine(x + 8f, y + 30f, x + 8f - legAngle, y + 80f, paint)

                  // تنه
                  paint.color = Color.parseColor(color)
                  canvas.drawRect(x - 18f, y - 20f, x + 18f, y + 30f, paint)

                  // سر
                  paint.color = Color.parseColor("#fde047")
                  canvas.drawCircle(x, y - 35f, 18f, paint)

                  // نوار سلامتی (Health Bar)
                  if (obj.health < obj.maxHealth && !obj.isDead) {
                      paint.color = Color.parseColor("#ef4444")
                      canvas.drawRect(x - 25f, y - 65f, x + 25f, y - 58f, paint)
                      paint.color = Color.parseColor("#22c55e")
                      val hWidth = 50f * (obj.health.toFloat() / obj.maxHealth.toFloat())
                      canvas.drawRect(x - 25f, y - 65f, x - 25f + hWidth, y - 58f, paint)
                  }
              }

              private fun drawHouse(canvas: Canvas, x: Float, y: Float) {
                  // دیواره‌های خانه
                  paint.color = Color.parseColor("#b45309")
                  canvas.drawRect(x, y - 100f, x + 160f, y + 80f, paint)
                  // سقف
                  paint.color = Color.parseColor("#7f1d1d")
                  canvas.drawRect(x - 10f, y - 130f, x + 170f, y - 100f, paint)
                  // درب
                  paint.color = Color.parseColor("#451a03")
                  canvas.drawRect(x + 60f, y, x + 100f, y + 80f, paint)
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (isPlayMode) return true
                  val x = event.x + cameraOffsetX
                  val y = event.y

                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> {
                          selectedObject = objects.findLast { obj ->
                              x >= obj.x - 50f && x <= obj.x + 50f && y >= obj.y - 50f && y <= obj.y + 50f
                          }
                          lastTouchX = x
                          lastTouchY = y
                      }
                      MotionEvent.ACTION_MOVE -> {
                          selectedObject?.let { obj ->
                              obj.x += x - lastTouchX
                              obj.y += y - lastTouchY
                              lastTouchX = x
                              lastTouchY = y
                          }
                      }
                  }
                  return true
              }
          }
          EOF

          # ۵. رابط کاربری اصلی همراه با دکمه‌های پرش و حمله (MainActivity)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/MainActivity.kt
          package com.persiangulf.gameengine

          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.MotionEvent
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import com.persiangulf.gameengine.engine.EngineViewport
          import com.persiangulf.gameengine.model.GameObject3D
          import com.persiangulf.gameengine.storage.ProjectStorage

          class MainActivity : AppCompatActivity() {
              private lateinit var storage: ProjectStorage
              private val gameObjects = mutableListOf<GameObject3D>()
              private lateinit var viewport: EngineViewport

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  storage = ProjectStorage(this)
                  val loaded = storage.loadProject()
                  if (loaded.isEmpty()) {
                      gameObjects.add(GameObject3D("1", "Player", "player", 200f, 500f, 0f, 1f, 1f, 1f, "#38bdf8", false))
                      gameObjects.add(GameObject3D("2", "Enemy_AI", "enemy", 800f, 500f, 0f, 1f, 1f, 1f, "#ef4444", true))
                      gameObjects.add(GameObject3D("3", "House_Prefab", "house", 1200f, 500f, 0f, 1f, 1f, 1f, "#b45309", false))
                      storage.saveProject(gameObjects)
                  } else {
                      gameObjects.addAll(loaded)
                  }

                  val mainLayout = FrameLayout(this)
                  viewport = EngineViewport(this, gameObjects)
                  mainLayout.addView(viewport)

                  // پنل بالا
                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#cc0f172a"))
                      setPadding(10, 10, 10, 10)
                  }

                  val btnAddEnemy = Button(this).apply { text = "+ دشمن"; setOnClickListener { addPrefab("enemy") } }
                  val btnAddHouse = Button(this).apply { text = "+ خانه"; setOnClickListener { addPrefab("house") } }
                  val btnMode = Button(this).apply {
                      text = "▶ تست بازی"
                      setOnClickListener {
                          viewport.isPlayMode = !viewport.isPlayMode
                          text = if (viewport.isPlayMode) "⏸ حالت ویرایش" else "▶ تست بازی"
                      }
                  }

                  topBar.addView(btnAddEnemy)
                  topBar.addView(btnAddHouse)
                  topBar.addView(btnMode)

                  val topParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT)
                  topParams.gravity = Gravity.TOP
                  mainLayout.addView(topBar, topParams)

                  // دکمه‌های حرکت
                  val ctrlLayout = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val btnLeft = Button(this).apply { text = "◀" }
                  btnLeft.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_MOVE || e.action == MotionEvent.ACTION_DOWN) viewport.movePlayer(-1f)
                      else if (e.action == MotionEvent.ACTION_UP) viewport.stopPlayer()
                      true
                  }
                  val btnRight = Button(this).apply { text = "▶" }
                  btnRight.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_MOVE || e.action == MotionEvent.ACTION_DOWN) viewport.movePlayer(1f)
                      else if (e.action == MotionEvent.ACTION_UP) viewport.stopPlayer()
                      true
                  }
                  ctrlLayout.addView(btnLeft)
                  ctrlLayout.addView(btnRight)

                  val ctrlParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT).apply {
                      gravity = Gravity.BOTTOM or Gravity.LEFT
                      setMargins(20, 0, 0, 20)
                  }
                  mainLayout.addView(ctrlLayout, ctrlParams)

                  // دکمه‌های اکشن (پرش و حمله)
                  val actionLayout = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val btnJump = Button(this).apply {
                      text = "🪂 پرش"
                      setOnClickListener { viewport.jumpPlayer() }
                  }
                  val btnAttack = Button(this).apply {
                      text = "⚔ حمله"
                      setOnClickListener { viewport.attackEnemy() }
                  }
                  actionLayout.addView(btnJump)
                  actionLayout.addView(btnAttack)

                  val actParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT).apply {
                      gravity = Gravity.BOTTOM or Gravity.RIGHT
                      setMargins(0, 0, 20, 20)
                  }
                  mainLayout.addView(actionLayout, actParams)

                  setContentView(mainLayout)
              }

              private fun addPrefab(type: String) {
                  val newObj = GameObject3D(
                      id = System.currentTimeMillis().toString(),
                      name = "$type_${gameObjects.size}",
                      type = type,
                      x = viewport.cameraOffsetX + 500f,
                      y = 500f,
                      colorHex = if (type == "enemy") "#ef4444" else "#b45309"
                  )
                  gameObjects.add(newObj)
                  storage.saveProject(gameObjects)
                  Toast.makeText(this, "$type جدید اضافه شد!", Toast.LENGTH_SHORT).show()
              }

              override fun onPause() {
                  super.onPause()
                  storage.saveProject(gameObjects)
              }
          }
          EOF

          # ۶. مانیفست و تنظیمات build.gradle
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.persiangulf.gameengine">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Pars Game Engine 3D"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '7.4.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.0' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              compileSdk 33
              defaultConfig {
                  applicationId "com.persiangulf.gameengine"
                  minSdk 23
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
              kotlinOptions { jvmTarget = '1.8' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
              implementation 'com.google.code.gson:gson:2.9.1'
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParsEngine3D-Module5
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Upgrade Pars Engine Module 5: Add Enemy AI, Jump Physics, Damage System & Prefabs" || echo "No changes"
          git push
