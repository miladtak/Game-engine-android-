name: Upgrade Persian Gulf Game Engine - Module 2 (Shooting, Physics & Joystick)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Upgrade Game Engine Project
        run: |
          mkdir -p app/src/main/java/com/persiangulf/gameengine/model
          mkdir -p app/src/main/java/com/persiangulf/gameengine/engine
          mkdir -p app/src/main/java/com/persiangulf/gameengine/storage
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:color="#090d16"/>
              <foreground android:color="#38bdf8"/>
          </adaptive-icon>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:color="#090d16"/>
              <foreground android:color="#38bdf8"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Persian Gulf Engine 3D</string>
          </resources>
          EOF

          # ۱. مدل داده گلوله‌ها (Bullet)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/model/Bullet.kt
          package com.persiangulf.gameengine.model

          data class Bullet(
              var x: Float,
              var y: Float,
              var speedX: Float = 800f,
              var radius: Float = 12f,
              var isAlive: Boolean = true
          )
          EOF

          # ۲. آپدیت مدل اصلی اشیاء (GameObject3D)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/model/GameObject3D.kt
          package com.persiangulf.gameengine.model

          data class GameObject3D(
              var id: String,
              var name: String,
              var type: String = "cube", // player, enemy, coin, platform
              var x: Float = 0f,
              var y: Float = 0f,
              var z: Float = 0f,
              var scaleX: Float = 1f,
              var scaleY: Float = 1f,
              var scaleZ: Float = 1f,
              var colorHex: String = "#38bdf8",
              var hasGravity: Boolean = true,
              var health: Int = 100,
              var velocityY: Float = 0f,
              var isSelected: Boolean = false
          )
          EOF

          # ۳. ذخیره‌ساز سه‌بعدی
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/storage/ProjectStorage.kt
          package com.persiangulf.gameengine.storage

          import android.content.Context
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import com.persiangulf.gameengine.model.GameObject3D
          import java.io.File

          class ProjectStorage(private val context: Context) {
              private val gson = Gson()
              private val fileName = "engine_3d_project.json"

              fun saveProject(objects: List<GameObject3D>) {
                  val json = gson.toJson(objects)
                  File(context.filesDir, fileName).writeText(json)
              }

              fun loadProject(): MutableList<GameObject3D> {
                  val file = File(context.filesDir, fileName)
                  if (!file.exists()) return mutableListOf()
                  val type = object : TypeToken<MutableList<GameObject3D>>() {}.type
                  return gson.fromJson(file.readText(), type) ?: mutableListOf()
              }
          }
          EOF

          # ۴. هسته اصلی رندر و فیزیک شلیک (EngineViewport)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/engine/EngineViewport.kt
          package com.persiangulf.gameengine.engine

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.view.MotionEvent
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import com.persiangulf.gameengine.model.Bullet
          import com.persiangulf.gameengine.model.GameObject3D

          class EngineViewport(context: Context, val objects: MutableList<GameObject3D>) : SurfaceView(context), Runnable, SurfaceHolder.Callback {
              private var thread: Thread? = null
              private var running = false
              private val paint = Paint()
              var selectedObject: GameObject3D? = null
              private var lastTouchX = 0f
              private var lastTouchY = 0f
              var isPlayMode = false
              
              val bullets = mutableListOf<Bullet>()
              private val toneGen = ToneGenerator(AudioManager.STREAM_MUSIC, 80)

              init { holder.addCallback(this) }

              override fun surfaceCreated(holder: SurfaceHolder) {
                  running = true
                  thread = Thread(this)
                  thread?.start()
              }
              override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {}
              override fun surfaceDestroyed(holder: SurfaceHolder) {
                  running = false
                  try { thread?.join() } catch (e: InterruptedException) { e.printStackTrace() }
              }

              fun shootBullet() {
                  val player = objects.find { it.type == "player" } ?: objects.firstOrNull()
                  player?.let {
                      bullets.add(Bullet(it.x + (100f * it.scaleX), it.y + (50f * it.scaleY)))
                      toneGen.startTone(ToneGenerator.TONE_PROP_BEEP, 50)
                  }
              }

              override fun run() {
                  var lastTime = System.nanoTime()
                  while (running) {
                      val now = System.nanoTime()
                      val dt = (now - lastTime) / 1000000000f
                      lastTime = now
                      if (dt < 0.1f) {
                          if (isPlayMode) updateGameLogic(dt)
                          drawScene()
                      }
                      try { Thread.sleep(16) } catch (e: InterruptedException) { e.printStackTrace() }
                  }
              }

              private fun updateGameLogic(dt: Float) {
                  // فیزیک گلوله‌ها
                  val bIterator = bullets.iterator()
                  while (bIterator.hasNext()) {
                      val bullet = bIterator.next()
                      bullet.x += bullet.speedX * dt
                      if (bullet.x > 1200f) {
                          bIterator.remove()
                          continue
                      }

                      // برخورد گلوله با اشیاء (Collision Detection)
                      for (obj in objects) {
                          if (obj.type != "player" && bullet.x >= obj.x && bullet.x <= obj.x + (100f * obj.scaleX) &&
                              bullet.y >= obj.y && bullet.y <= obj.y + (100f * obj.scaleY)) {
                              obj.health -= 25
                              toneGen.startTone(ToneGenerator.TONE_CDMA_PIP, 40)
                              if (obj.health <= 0) obj.colorHex = "#475569" // تغییر رنگ به علامت نابودی
                              bIterator.remove()
                              break
                          }
                      }
                  }

                  // فیزیک جاذبه
                  for (obj in objects) {
                      if (obj.hasGravity && obj.y < 600f) {
                          obj.velocityY += 980f * dt
                          obj.y += obj.velocityY * dt
                          if (obj.y >= 600f) {
                              obj.y = 600f
                              obj.velocityY = 0f
                          }
                      }
                  }
              }

              private fun drawScene() {
                  if (!holder.surface.isValid) return
                  val canvas: Canvas = holder.lockCanvas()
                  canvas.drawColor(Color.parseColor("#0f172a"))

                  // گرید زمین
                  paint.color = Color.parseColor("#334155")
                  paint.strokeWidth = 2f
                  for (i in 0..1080 step 100) canvas.drawLine(i.toFloat(), 0f, i.toFloat(), 2000f, paint)

                  // خط زمین
                  paint.color = Color.parseColor("#22c55e")
                  paint.strokeWidth = 6f
                  canvas.drawLine(0f, 660f, 1080f, 660f, paint)

                  // رندر گلوله‌ها
                  paint.color = Color.parseColor("#ef4444")
                  for (bullet in bullets) {
                      canvas.drawCircle(bullet.x, bullet.y, bullet.radius, paint)
                  }

                  // رندر اشیاء
                  for (obj in objects) {
                      val width = 100f * obj.scaleX
                      val height = 100f * obj.scaleY

                      // سایه
                      paint.color = Color.parseColor("#000000")
                      paint.alpha = 80
                      canvas.drawOval(obj.x, 650f, obj.x + width, 670f, paint)

                      // بدنه
                      paint.color = Color.parseColor(if (obj.colorHex.startsWith("#")) obj.colorHex else "#38bdf8")
                      paint.alpha = 255
                      canvas.drawRect(obj.x, obj.y, obj.x + width, obj.y + height, paint)

                      // نوار سلامتی در صورت آسیب
                      if (obj.health < 100) {
                          paint.color = Color.parseColor("#22c55e")
                          canvas.drawRect(obj.x, obj.y - 15f, obj.x + (width * (obj.health / 100f)), obj.y - 5f, paint)
                      }

                      // کادر انتخاب
                      if (obj == selectedObject && !isPlayMode) {
                          paint.style = Paint.Style.STROKE
                          paint.color = Color.parseColor("#f59e0b")
                          paint.strokeWidth = 5f
                          canvas.drawRect(obj.x - 10f, obj.y - 10f, obj.x + width + 10f, obj.y + height + 10f, paint)
                          paint.style = Paint.Style.FILL
                      }
                  }
                  holder.unlockCanvasAndPost(canvas)
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (isPlayMode) return true
                  val x = event.x
                  val y = event.y

                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> {
                          selectedObject = objects.findLast { obj ->
                              val w = 100f * obj.scaleX
                              val h = 100f * obj.scaleY
                              x >= obj.x && x <= obj.x + w && y >= obj.y && y <= obj.y + h
                          }
                          lastTouchX = x
                          lastTouchY = y
                      }
                      MotionEvent.ACTION_MOVE -> {
                          selectedObject?.let { obj ->
                              obj.x += x - lastTouchX
                              obj.y += y - lastTouchY
                              lastTouchX = x
                              lastTouchY = y
                          }
                      }
                  }
                  return true
              }
          }
          EOF

          # ۵. رابط کاربری اصلی همراه با دکمه شلیک و کنترلر (MainActivity)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/MainActivity.kt
          package com.persiangulf.gameengine

          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import com.persiangulf.gameengine.engine.EngineViewport
          import com.persiangulf.gameengine.model.GameObject3D
          import com.persiangulf.gameengine.storage.ProjectStorage

          class MainActivity : AppCompatActivity() {
              private lateinit var storage: ProjectStorage
              private val gameObjects = mutableListOf<GameObject3D>()
              private lateinit var viewport: EngineViewport

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  storage = ProjectStorage(this)
                  val loaded = storage.loadProject()
                  if (loaded.isEmpty()) {
                      gameObjects.add(GameObject3D("1", "Player", "player", 100f, 500f, 0f, 1f, 1f, 1f, "#38bdf8", false))
                      gameObjects.add(GameObject3D("2", "Enemy", "enemy", 600f, 500f, 0f, 1f, 1.2f, 1f, "#ef4444", true))
                      storage.saveProject(gameObjects)
                  } else {
                      gameObjects.addAll(loaded)
                  }

                  val mainLayout = FrameLayout(this)
                  viewport = EngineViewport(this, gameObjects)
                  mainLayout.addView(viewport)

                  // پنل بالای صفحه
                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#cc0f172a"))
                      setPadding(15, 15, 15, 15)
                  }

                  val btnAdd = Button(this).apply { text = "+ افزودن شیء"; setOnClickListener { addNewObject() } }
                  val btnInspect = Button(this).apply { text = "⚙ تنظیمات"; setOnClickListener { openInspector() } }
                  val btnMode = Button(this).apply {
                      text = "▶ حالت بازی"
                      setOnClickListener {
                          viewport.isPlayMode = !viewport.isPlayMode
                          text = if (viewport.isPlayMode) "⏸ حالت ویرایش" else "▶ حالت بازی"
                      }
                  }

                  topBar.addView(btnAdd)
                  topBar.addView(btnInspect)
                  topBar.addView(btnMode)

                  val topParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT)
                  topParams.gravity = Gravity.TOP
                  mainLayout.addView(topBar, topParams)

                  // دکمه شلیک لمسی
                  val btnShoot = Button(this).apply {
                      text = "🔥 شلیک"
                      setBackgroundColor(Color.parseColor("#ef4444"))
                      setTextColor(Color.WHITE)
                      setOnClickListener { viewport.shootBullet() }
                  }
                  val shootParams = FrameLayout.LayoutParams(250, 150).apply {
                      gravity = Gravity.BOTTOM or Gravity.RIGHT
                      setMargins(0, 0, 40, 40)
                  }
                  mainLayout.addView(btnShoot, shootParams)

                  setContentView(mainLayout)
              }

              private fun addNewObject() {
                  val newObj = GameObject3D(
                      id = System.currentTimeMillis().toString(),
                      name = "Enemy_${gameObjects.size}",
                      type = "enemy",
                      x = 500f,
                      y = 300f,
                      colorHex = "#facc15"
                  )
                  gameObjects.add(newObj)
                  storage.saveProject(gameObjects)
                  Toast.makeText(this, "دشمن جدید اضافه شد!", Toast.LENGTH_SHORT).show()
              }

              private fun openInspector() {
                  val obj = viewport.selectedObject
                  if (obj == null) {
                      Toast.makeText(this, "یک شیء را لمس کنید!", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(30, 30, 30, 30)
                  }

                  val edtColor = EditText(this).apply { hint = "کد رنگ"; setText(obj.colorHex) }
                  val chkGravity = CheckBox(this).apply { text = "جاذبه"; isChecked = obj.hasGravity }

                  layout.addView(TextView(this).apply { text = "ویرایش: ${obj.name}" })
                  layout.addView(edtColor)
                  layout.addView(chkGravity)

                  androidx.appcompat.app.AlertDialog.Builder(this)
                      .setTitle("Inspector")
                      .setView(layout)
                      .setPositiveButton("ذخیره") { _, _ ->
                          obj.colorHex = edtColor.text.toString()
                          obj.hasGravity = chkGravity.isChecked
                          storage.saveProject(gameObjects)
                      }
                      .setNegativeButton("حذف") { _, _ ->
                          gameObjects.remove(obj)
                          viewport.selectedObject = null
                          storage.saveProject(gameObjects)
                      }
                      .show()
              }

              override fun onPause() {
                  super.onPause()
                  storage.saveProject(gameObjects)
              }
          }
          EOF

          # ۶. مانیفست و تنظیمات build.gradle
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.persiangulf.gameengine">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Persian Gulf Engine 3D"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '7.4.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.0' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              compileSdk 33
              defaultConfig {
                  applicationId "com.persiangulf.gameengine"
                  minSdk 23
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
              kotlinOptions { jvmTarget = '1.8' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
              implementation 'com.google.code.gson:gson:2.9.1'
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersianGulfEngine3D-Module2
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Upgrade Persian Gulf Engine Module 2: Add Shooting, Physics Collision & Sound Effects" || echo "No changes"
          git push
