name: Build 2D/3D Native Android Game Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean old files and setup 2D/3D Engine
        run: |
          # پاکسازی فایل‌های قبلی برای شروع تمیز
          rm -rf app/src/main/java/com/persiangulf/gameengine/*
          rm -f build.gradle app/build.gradle app/src/main/AndroidManifest.xml

          # ساخت پوشه‌های ساختار جدید
          mkdir -p app/src/main/java/com/persiangulf/gameengine/model
          mkdir -p app/src/main/java/com/persiangulf/gameengine/engine
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

          # ۱. مدل داده‌های پیشرفته (پشتیبانی از دوبعدی و سه‌بعدی با مختصات Z و چرخش)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/model/GameObject.kt
          package com.persiangulf.gameengine.model

          data class GameObject(
              var id: String,
              var name: String,
              var type: String, // 'player', 'platform', 'enemy', 'coin', 'goal', 'box_3d'
              var is3D: Boolean = false, // تشخیص حالت سه‌بعدی یا دوبعدی
              var x: Float,
              var y: Float,
              var z: Float = 0f, // عمق در محیط سه‌بعدی
              var width: Float,
              var height: Float,
              var depth: Float = 50f, // ضخامت برای اشیاء سه‌بعدی
              var rotation: Float = 0f, // زاویه چرخش
              var color: String,
              var speed: Float = 200f,
              var jumpPower: Float = 500f,
              var health: Int = 3
          )
          EOF

          # ۲. هسته موتور گرافیکی ترکیبی (2D & 3D Isometric Renderer)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/engine/GameEngineView.kt
          package com.persiangulf.gameengine.engine

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.MotionEvent
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import com.persiangulf.gameengine.model.GameObject

          class GameEngineView(context: Context, private val objects: MutableList<GameObject>) : SurfaceView(context), Runnable, SurfaceHolder.Callback {
              
              private var thread: Thread? = null
              private var running = false
              private val paint = Paint()
              
              private var player: GameObject? = objects.find { it.type == "player" }
              private var playerVelocityY = 0f
              private val gravity = 800f
              private var isGrounded = false

              init {
                  holder.addCallback(this)
              }

              override fun surfaceCreated(holder: SurfaceHolder) {
                  running = true
                  thread = Thread(this)
                  thread?.start()
              }

              override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {}

              override fun surfaceDestroyed(holder: SurfaceHolder) {
                  var retry = true
                  running = false
                  while (retry) {
                      try {
                          thread?.join()
                          retry = false
                      } catch (e: InterruptedException) {
                          e.printStackTrace()
                      }
                  }
              }

              override fun run() {
                  var lastTime = System.nanoTime()
                  while (running) {
                      val now = System.nanoTime()
                      val dt = (now - lastTime) / 1000000000f
                      lastTime = now

                      if (dt < 0.1f) {
                          update(dt)
                          draw()
                      }
                      try {
                          Thread.sleep(16)
                      } catch (e: InterruptedException) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun update(dt: Float) {
                  player?.let { p ->
                      if (!isGrounded) {
                          playerVelocityY += gravity * dt
                      }
                      p.y += playerVelocityY * dt

                      // فیزیک برخورد با سکوهای دوبعدی و سه‌بعدی
                      for (obj in objects) {
                          if (obj.type == "platform" || obj.type == "box_3d") {
                              if (p.x < obj.x + obj.width && p.x + p.width > obj.x &&
                                  p.y + p.height >= obj.y && p.y + p.height <= obj.y + 25f && playerVelocityY > 0) {
                                  p.y = obj.y - p.height
                                  playerVelocityY = 0f
                                  isGrounded = true
                              }
                          }
                      }
                  }
              }

              private fun draw() {
                  if (!holder.surface.isValid) return
                  val canvas: Canvas = holder.lockCanvas()
                  
                  // پس‌زمینه محیط بازی
                  canvas.drawColor(Color.parseColor("#0f172a"))

                  // مرتب‌سازی المان‌ها بر اساس عمق (برای نمایش صحیح سه‌بعدی و ایزومتریک)
                  val sortedObjects = objects.sortedWith(compareBy({ it.z }, { it.y }))

                  for (obj in sortedObjects) {
                      paint.color = Color.parseColor(if (obj.color.startsWith("#")) obj.color else "#38bdf8")
                      
                      if (obj.is3D) {
                          // شبیه‌سازی سه‌بعدی و جعبه‌ای با ترسیم لایه‌های مکعبی
                          val depthOffset = obj.depth * 0.4f
                          
                          // سایه و وجه پایینی مکعب سه‌بعدی
                          paint.alpha = 150
                          canvas.drawRect(obj.x + depthOffset, obj.y - depthOffset, obj.x + obj.width + depthOffset, obj.y + obj.height - depthOffset, paint)
                          
                          // وجه اصلی مکعب سه‌بعدی
                          paint.alpha = 255
                          canvas.drawRect(obj.x, obj.y, obj.x + obj.width, obj.y + obj.height, paint)
                      } else {
                          // المان استاندارد دوبعدی
                          paint.alpha = 255
                          canvas.drawRect(obj.x, obj.y, obj.x + obj.width, obj.y + obj.height, paint)
                      }
                  }

                  holder.unlockCanvasAndPost(canvas)
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (event.action == MotionEvent.ACTION_DOWN) {
                      if (isGrounded) {
                          playerVelocityY = -650f
                          isGrounded = false
                      }
                  }
                  return true
              }
          }
          EOF

          # ۳. فایل مانیفست اندروید
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.persiangulf.gameengine">

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="موتور بازی‌سازی خلیج فارس (2D/3D)"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # ۴. تنظیمات Gradle اصلی پروژه
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:7.4.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # ۵. تنظیمات Gradle ماژول اپ
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              compileSdk 33

              defaultConfig {
                  applicationId "com.persiangulf.gameengine"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
          }
          EOF

          # اعمال تغییرات و پوش به گیت‌هاب
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Reset and setup 2D/3D native engine structure" || echo "No changes to commit"
          git push
