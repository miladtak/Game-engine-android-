name: Build Full Game Engine APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Full Game Engine Project
        run: |
          mkdir -p app/src/main/java/com/persiangulf/gameengine/model
          mkdir -p app/src/main/java/com/persiangulf/gameengine/engine
          mkdir -p app/src/main/java/com/persiangulf/gameengine/script
          mkdir -p app/src/main/java/com/persiangulf/gameengine/storage
          mkdir -p app/src/main/java/com/persiangulf/gameengine/ui
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-fa
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # آیکن‌ها
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:color="#090d16"/>
              <foreground android:color="#38bdf8"/>
          </adaptive-icon>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:color="#090d16"/>
              <foreground android:color="#38bdf8"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Game Engine Persian Gulf</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-fa/strings.xml
          <resources>
              <string name="app_name">موتور بازی‌سازی خلیج فارس</string>
          </resources>
          EOF

          # ۱. مدل داده ابجکت‌ها (GameObject)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/model/GameObject.kt
          package com.persiangulf.gameengine.model

          data class GameObject(
              var id: String,
              var name: String,
              var type: String, // player, platform, coin, enemy, box_3d
              var is3D: Boolean = false,
              var x: Float,
              var y: Float,
              var z: Float = 0f,
              var width: Float,
              var height: Float,
              var depth: Float = 40f,
              var color: String = "#38bdf8",
              var speed: Float = 200f,
              var script: String = ""
          )
          EOF

          # ۲. مفسر اسکریپت پیشرفته (ScriptParser)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/script/ScriptParser.kt
          package com.persiangulf.gameengine.script

          import com.persiangulf.gameengine.model.GameObject

          class ScriptParser {
              fun execute(obj: GameObject) {
                  if (obj.script.isEmpty()) return
                  val commands = obj.script.lowercase().split(";")
                  for (cmd in commands) {
                      val parts = cmd.trim().split(" ")
                      if (parts.isEmpty()) continue
                      when (parts[0]) {
                          "move_right" -> obj.x += obj.speed * 0.016f
                          "move_left" -> obj.x -= obj.speed * 0.016f
                          "move_up" -> obj.y -= obj.speed * 0.016f
                          "move_down" -> obj.y += obj.speed * 0.016f
                          "set_color" -> { if (parts.size > 1) obj.color = parts[1] }
                      }
                  }
              }
          }
          EOF

          # ۳. ذخیره‌سازی پروژه (ProjectStorage)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/storage/ProjectStorage.kt
          package com.persiangulf.gameengine.storage

          import android.content.Context
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import com.persiangulf.gameengine.model.GameObject
          import java.io.File

          class ProjectStorage(private val context: Context) {
              private val gson = Gson()
              private val fileName = "persian_gulf_engine_project.json"

              fun saveProject(objects: List<GameObject>) {
                  val json = gson.toJson(objects)
                  File(context.filesDir, fileName).writeText(json)
              }

              fun loadProject(): MutableList<GameObject> {
                  val file = File(context.filesDir, fileName)
                  if (!file.exists()) return mutableListOf()
                  val type = object : TypeToken<MutableList<GameObject>>() {}.type
                  return gson.fromJson(file.readText(), type) ?: mutableListOf()
              }
          }
          EOF

          # ۴. هسته گرافیکی و اجرای بازی (GameEngineView)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/engine/GameEngineView.kt
          package com.persiangulf.gameengine.engine

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.MotionEvent
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import com.persiangulf.gameengine.model.GameObject
          import com.persiangulf.gameengine.script.ScriptParser

          class GameEngineView(context: Context, private val objects: MutableList<GameObject>) : SurfaceView(context), Runnable, SurfaceHolder.Callback {
              private var thread: Thread? = null
              private var running = false
              private val paint = Paint()
              private val scriptParser = ScriptParser()
              private var player: GameObject? = objects.find { it.type == "player" } ?: objects.firstOrNull()
              private var playerVelocityY = 0f
              private val gravity = 850f
              var isGrounded = false

              init { holder.addCallback(this) }

              override fun surfaceCreated(holder: SurfaceHolder) {
                  running = true
                  thread = Thread(this)
                  thread?.start()
              }
              override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {}
              override fun surfaceDestroyed(holder: SurfaceHolder) {
                  running = false
                  try { thread?.join() } catch (e: InterruptedException) { e.printStackTrace() }
              }

              override fun run() {
                  var lastTime = System.nanoTime()
                  while (running) {
                      val now = System.nanoTime()
                      val dt = (now - lastTime) / 1000000000f
                      lastTime = now
                      if (dt < 0.1f) { update(dt); draw() }
                      try { Thread.sleep(16) } catch (e: InterruptedException) { e.printStackTrace() }
                  }
              }

              private fun update(dt: Float) {
                  player?.let { p ->
                      if (!isGrounded) playerVelocityY += gravity * dt
                      p.y += playerVelocityY * dt
                      isGrounded = false

                      for (obj in objects) {
                          if (obj.type == "platform" || obj.type == "box_3d") {
                              if (p.x < obj.x + obj.width && p.x + p.width > obj.x &&
                                  p.y + p.height >= obj.y && p.y + p.height <= obj.y + 30f && playerVelocityY > 0) {
                                  p.y = obj.y - p.height
                                  playerVelocityY = 0f
                                  isGrounded = true
                              }
                          }
                          scriptParser.execute(obj)
                      }
                  }
              }

              private fun draw() {
                  if (!holder.surface.isValid) return
                  val canvas: Canvas = holder.lockCanvas()
                  canvas.drawColor(Color.parseColor("#090d16"))
                  val sortedObjects = objects.sortedWith(compareBy({ it.z }, { it.y }))
                  for (obj in sortedObjects) {
                      paint.color = Color.parseColor(if (obj.color.startsWith("#")) obj.color else "#38bdf8")
                      if (obj.is3D || obj.type == "box_3d") {
                          val dOff = obj.depth * 0.35f
                          paint.alpha = 120
                          canvas.drawRect(obj.x + dOff, obj.y - dOff, obj.x + obj.width + dOff, obj.y + obj.height - dOff, paint)
                          paint.alpha = 255
                          canvas.drawRect(obj.x, obj.y, obj.x + obj.width, obj.y + obj.height, paint)
                      } else {
                          paint.alpha = 255
                          canvas.drawRect(obj.x, obj.y, obj.x + obj.width, obj.y + obj.height, paint)
                      }
                  }
                  holder.unlockCanvasAndPost(canvas)
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (event.action == MotionEvent.ACTION_DOWN && isGrounded) {
                      playerVelocityY = -680f
                      isGrounded = false
                  }
                  return true
              }
          }
          EOF

          # ۵. محیط کاربری موتور (MainActivity) شامل پنل افزودن ابجکت، ویرایشگر اسکریپت و اجرا
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/MainActivity.kt
          package com.persiangulf.gameengine

          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import com.persiangulf.gameengine.engine.GameEngineView
          import com.persiangulf.gameengine.model.GameObject
          import com.persiangulf.gameengine.storage.ProjectStorage

          class MainActivity : AppCompatActivity() {
              private lateinit var storage: ProjectStorage
              private val gameObjects = mutableListOf<GameObject>()
              private lateinit var rootLayout: FrameLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  storage = ProjectStorage(this)
                  val loaded = storage.loadProject()
                  if (loaded.isEmpty()) {
                      gameObjects.add(GameObject("1", "Player", "player", false, 100f, 300f, 0f, 60f, 60f, 40f, "#38bdf8", 200f, ""))
                      gameObjects.add(GameObject("2", "Ground", "platform", true, 0f, 650f, 0f, 1080f, 100f, 50f, "#1e293b", 0f, ""))
                      storage.saveProject(gameObjects)
                  } else {
                      gameObjects.addAll(loaded)
                  }

                  rootLayout = FrameLayout(this)
                  setContentView(rootLayout)
                  showEngineUI()
              }

              private fun showEngineUI() {
                  rootLayout.removeAllViews()
                  val engineView = GameEngineView(this, gameObjects)
                  rootLayout.addView(engineView)

                  // پنل ابزارهای موتور در بالای صفحه
                  val topPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#99090d16"))
                      setPadding(20, 20, 20, 20)
                  }

                  val btnAdd = Button(this).textButton("افزودن شیء +") { showAddObjectDialog() }
                  val btnPlay = Button(this).textButton("اجرای بازی ▶") { 
                      Toast.makeText(this, "روی صفحه ضربه بزنید تا بازیکن بپرد!", Toast.LENGTH_LONG).show()
                  }

                  topPanel.addView(btnAdd)
                  topPanel.addView(btnPlay)
                  
                  val params = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT)
                  params.gravity = Gravity.TOP
                  rootLayout.addView(topPanel, params)
              }

              private fun showAddObjectDialog() {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 40, 40, 40)
                  }

                  val edtName = EditText(this).apply { hint = "نام شیء (مثل Coin یا Enemy)" }
                  val spinnerType = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, listOf("platform (سکو)", "coin (سکه)", "enemy (دشمن)", "box_3d (جعبه سه‌بعدی)"))
                  }
                  val edtScript = EditText(this).apply { hint = "اسکریپت (مثل: move_right; set_color #ff0000)" }

                  layout.addView(edtName)
                  layout.addView(spinnerType)
                  layout.addView(edtScript)

                  androidx.appcompat.app.AlertDialog.Builder(this)
                      .setTitle("ساخت شیء جدید در موتور")
                      .setView(layout)
                      .setPositiveButton("ساخت") { _, _ ->
                          val name = if (edtName.text.isNotEmpty()) edtName.text.toString() else "Object"
                          val typeSel = spinnerType.selectedItem.toString().split(" ")[0]
                          val script = edtScript.text.toString()
                          
                          val newObj = GameObject(
                              id = System.currentTimeMillis().toString(),
                              name = name,
                              type = typeSel,
                              is3D = typeSel == "box_3d",
                              x = (100..400).random().toFloat(),
                              y = 200f,
                              width = 60f,
                              height = 60f,
                              color = if(typeSel == "coin") "#facc15" else if(typeSel == "enemy") "#ef4444" else "#10b981",
                              script = script
                          )
                          gameObjects.add(newObj)
                          storage.saveProject(gameObjects)
                          showEngineUI()
                          Toast.makeText(this, "شیء با موفقیت اضافه شد!", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("لغو", null)
                      .show()
              }

              private fun Button.textButton(text: String, onClick: () -> Unit): Button {
                  this.text = text
                  this.setOnClickListener { onClick() }
                  this.setBackgroundColor(Color.parseColor("#38bdf8"))
                  this.setTextColor(Color.parseColor("#090d16"))
                  val params = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  params.setMargins(10, 0, 10, 0)
                  this.layoutParams = params
                  return this
              }

              override fun onPause() {
                  super.onPause()
                  storage.saveProject(gameObjects)
              }
          }
          EOF

          # ۶. مانیفست
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.persiangulf.gameengine">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Game Engine Persian Gulf"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '7.4.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.0' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              compileSdk 33
              defaultConfig {
                  applicationId "com.persiangulf.gameengine"
                  minSdk 23
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
              kotlinOptions { jvmTarget = '1.8' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
              implementation 'com.google.code.gson:gson:2.9.1'
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersianGulfEngine-Debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Upgrade project to a full Game Engine with UI, object creator and script parser" || echo "No changes"
          git push
