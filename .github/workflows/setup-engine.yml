name: Build Game Engine Persian Gulf (Full Native 2D/3D + Scripting)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean and Setup Persian Gulf Game Engine
        run: |
          # پاکسازی کامل برای ساختار جدید
          rm -rf app/src/main/java/com/persiangulf/gameengine/*
          rm -f build.gradle app/build.gradle app/src/main/AndroidManifest.xml

          # ساخت پوشه‌های استاندارد اندروید استودیو
          mkdir -p app/src/main/java/com/persiangulf/gameengine/model
          mkdir -p app/src/main/java/com/persiangulf/gameengine/engine
          mkdir -p app/src/main/java/com/persiangulf/gameengine/ui
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

          # ۱. مدل داده‌ها با پشتیبانی از مختصات Z (سه‌بعدی) و اسکریپت‌های رفتاری
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/model/GameObject.kt
          package com.persiangulf.gameengine.model

          data class GameObject(
              var id: String,
              var name: String,
              var type: String, // 'player', 'platform', 'enemy', 'coin', 'box_3d', 'hazard'
              var is3D: Boolean = false,
              var x: Float,
              var y: Float,
              var z: Float = 0f, // عمق سه‌بعدی
              var width: Float,
              var height: Float,
              var depth: Float = 40f,
              var color: String,
              var speed: Float = 200f,
              var jumpPower: Float = 500f,
              var health: Int = 3,
              var customScript: String = "" // اسکریپت سفارشی کاربر برای شیء
          )
          EOF

          # ۲. هسته موتور گرافیکی و فیزیک بازی (2D & 3D Isometric Renderer)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/engine/GameEngineView.kt
          package com.persiangulf.gameengine.engine

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.MotionEvent
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import com.persiangulf.gameengine.model.GameObject

          class GameEngineView(context: Context, private val objects: MutableList<GameObject>) : SurfaceView(context), Runnable, SurfaceHolder.Callback {
              
              private var thread: Thread? = null
              private var running = false
              private val paint = Paint()
              
              private var player: GameObject? = objects.find { type == "player" } || objects.firstOrNull()
              private var playerVelocityY = 0f
              private val gravity = 850f
              private var isGrounded = false

              init {
                  holder.addCallback(this)
              }

              override fun surfaceCreated(holder: SurfaceHolder) {
                  running = true
                  thread = Thread(this)
                  thread?.start()
              }

              override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {}

              override fun surfaceDestroyed(holder: SurfaceHolder) {
                  var retry = true
                  running = false
                  while (retry) {
                      try {
                          thread?.join()
                          retry = false
                      } catch (e: InterruptedException) {
                          e.printStackTrace()
                      }
                  }
              }

              override fun run() {
                  var lastTime = System.nanoTime()
                  while (running) {
                      val now = System.nanoTime()
                      val dt = (now - lastTime) / 1000000000f
                      lastTime = now

                      if (dt < 0.1f) {
                          update(dt)
                          draw()
                      }
                      try {
                          Thread.sleep(16)
                      } catch (e: InterruptedException) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun update(dt: Float) {
                  player?.let { p ->
                      // اعمال فیزیک جاذبه
                      if (!isGrounded) {
                          playerVelocityY += gravity * dt
                      }
                      p.y += playerVelocityY * dt

                      // بررسی برخورد با زمین و سکوها
                      isGrounded = false
                      for (obj in objects) {
                          if (obj.type == "platform" || obj.type == "box_3d") {
                              if (p.x < obj.x + obj.width && p.x + p.width > obj.x &&
                                  p.y + p.height >= obj.y && p.y + p.height <= obj.y + 25f && playerVelocityY > 0) {
                                  p.y = obj.y - p.height
                                  playerVelocityY = 0f
                                  isGrounded = true
                              }
                          }
                      }
                  }
              }

              private fun draw() {
                  if (!holder.surface.isValid) return
                  val canvas: Canvas = holder.lockCanvas()
                  
                  # رنگ پس‌زمینه محیط بازی (خلیج فارس / دارک فانتزی)
                  canvas.drawColor(Color.parseColor("#090d16"))

                  // مرتب‌سازی لایه‌ها برای نمایش صحیح دوبعدی و سه‌بعدی (براساس Z و Y)
                  val sortedObjects = objects.sortedWith(compareBy({ it.z }, { it.y }))

                  for (obj in sortedObjects) {
                      paint.color = Color.parseColor(if (obj.color.startsWith("#")) obj.color else "#38bdf8")
                      
                      if (obj.is3D) {
                          // رندر سه‌بعدی جعبه‌ای (مکعب ایزومتریک)
                          val dOff = obj.depth * 0.35f
                          paint.alpha = 140
                          canvas.drawRect(obj.x + dOff, obj.y - dOff, obj.x + obj.width + dOff, obj.y + obj.height - dOff, paint)
                          
                          paint.alpha = 255
                          canvas.drawRect(obj.x, obj.y, obj.x + obj.width, obj.y + obj.height, paint)
                      } else {
                          // رندر دوبعدی استاندارد
                          paint.alpha = 255
                          canvas.drawRect(obj.x, obj.y, obj.x + obj.width, obj.y + obj.height, paint)
                      }
                  }

                  holder.unlockCanvasAndPost(canvas)
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (event.action == MotionEvent.ACTION_DOWN) {
                      if (isGrounded) {
                          playerVelocityY = -680f
                          isGrounded = false
                      }
                  }
                  return true
              }
          }
          EOF

          # ۳. فایل مانیفست اندروید
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.persiangulf.gameengine">

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Game Engine Persian Gulf"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # ۴. تنظیمات Gradle اصلی
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:7.4.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # ۵. تنظیمات Gradle ماژول اپ
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              compileSdk 33

              defaultConfig {
                  applicationId "com.persiangulf.gameengine"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
          }
          EOF

          # اعمال تغییرات و ثبت در گیت‌هاب
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Initialize Game Engine Persian Gulf with 2D/3D and Scripting support" || echo "No changes to commit"
          git push
