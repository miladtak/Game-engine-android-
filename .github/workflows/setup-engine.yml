name: Upgrade Pars Game Engine - Module 4 (Character Rigging & Walking Animation)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Upgrade Pars Game Engine Project
        run: |
          mkdir -p app/src/main/java/com/persiangulf/gameengine/model
          mkdir -p app/src/main/java/com/persiangulf/gameengine/engine
          mkdir -p app/src/main/java/com/persiangulf/gameengine/storage
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:color="#090d16"/>
              <foreground android:color="#38bdf8"/>
          </adaptive-icon>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:color="#090d16"/>
              <foreground android:color="#38bdf8"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Pars Game Engine 3D</string>
          </resources>
          EOF

          # ۱. مدل ذرات (Particle Model)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/model/Particle.kt
          package com.persiangulf.gameengine.model

          data class Particle(
              var x: Float,
              var y: Float,
              var vx: Float,
              var vy: Float,
              var colorHex: String = "#facc15",
              var life: Float = 1.0f
          )
          EOF

          # ۲. مدل داده اشیاء موتور پارس (GameObject3D)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/model/GameObject3D.kt
          package com.persiangulf.gameengine.model

          data class GameObject3D(
              var id: String,
              var name: String,
              var type: String = "cube", // player, enemy, platform
              var x: Float = 0f,
              var y: Float = 0f,
              var z: Float = 0f,
              var scaleX: Float = 1f,
              var scaleY: Float = 1f,
              var scaleZ: Float = 1f,
              var colorHex: String = "#38bdf8",
              var textureStyle: String = "solid",
              var hasGravity: Boolean = true,
              var health: Int = 100,
              var velocityY: Float = 0f,
              var isWalking: Boolean = false,
              var animFrame: Float = 0f
          )
          EOF

          # ۳. ذخیره‌سازی پروژه پارس
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/storage/ProjectStorage.kt
          package com.persiangulf.gameengine.storage

          import android.content.Context
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import com.persiangulf.gameengine.model.GameObject3D
          import java.io.File

          class ProjectStorage(private val context: Context) {
              private val gson = Gson()
              private val fileName = "pars_engine_3d_project.json"

              fun saveProject(objects: List<GameObject3D>) {
                  val json = gson.toJson(objects)
                  File(context.filesDir, fileName).writeText(json)
              }

              fun loadProject(): MutableList<GameObject3D> {
                  val file = File(context.filesDir, fileName)
                  if (!file.exists()) return mutableListOf()
                  val type = object : TypeToken<MutableList<GameObject3D>>() {}.type
                  return gson.fromJson(file.readText(), type) ?: mutableListOf()
              }
          }
          EOF

          # ۴. هسته اصلی رندر، انیمیشن کاراکتر و دوربین در موتور پارس (EngineViewport)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/engine/EngineViewport.kt
          package com.persiangulf.gameengine.engine

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.view.MotionEvent
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import com.persiangulf.gameengine.model.GameObject3D
          import com.persiangulf.gameengine.model.Particle
          import kotlin.math.sin

          class EngineViewport(context: Context, val objects: MutableList<GameObject3D>) : SurfaceView(context), Runnable, SurfaceHolder.Callback {
              private var thread: Thread? = null
              private var running = false
              private val paint = Paint()
              var selectedObject: GameObject3D? = null
              private var lastTouchX = 0f
              private var lastTouchY = 0f
              var isPlayMode = false
              
              val particles = mutableListOf<Particle>()
              private val toneGen = ToneGenerator(AudioManager.STREAM_MUSIC, 80)

              var cameraOffsetX = 0f

              init { holder.addCallback(this) }

              override fun surfaceCreated(holder: SurfaceHolder) {
                  running = true
                  thread = Thread(this)
                  thread?.start()
              }
              override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {}
              override fun surfaceDestroyed(holder: SurfaceHolder) {
                  running = false
                  try { thread?.join() } catch (e: InterruptedException) { e.printStackTrace() }
              }

              fun movePlayer(dir: Float) {
                  val player = objects.find { it.type == "player" } ?: return
                  player.x += dir * 12f
                  player.isWalking = true
                  player.animFrame += 0.2f
              }

              fun stopPlayer() {
                  val player = objects.find { it.type == "player" } ?: return
                  player.isWalking = false
              }

              override fun run() {
                  var lastTime = System.nanoTime()
                  while (running) {
                      val now = System.nanoTime()
                      val dt = (now - lastTime) / 1000000000f
                      lastTime = now
                      if (dt < 0.1f) {
                          if (isPlayMode) updateGameLogic(dt)
                          updateParticles(dt)
                          drawScene()
                      }
                      try { Thread.sleep(16) } catch (e: InterruptedException) { e.printStackTrace() }
                  }
              }

              private fun updateParticles(dt: Float) {
                  val pIter = particles.iterator()
                  while (pIter.hasNext()) {
                      val p = pIter.next()
                      p.x += p.vx * dt
                      p.y += p.vy * dt
                      p.life -= dt * 2f
                      if (p.life <= 0f) pIter.remove()
                  }
              }

              private fun updateGameLogic(dt: Float) {
                  val player = objects.find { it.type == "player" }
                  player?.let {
                      cameraOffsetX = it.x - 400f
                  }

                  for (obj in objects) {
                      if (obj.hasGravity && obj.y < 500f) {
                          obj.velocityY += 980f * dt
                          obj.y += obj.velocityY * dt
                          if (obj.y >= 500f) {
                              obj.y = 500f
                              obj.velocityY = 0f
                          }
                      }
                  }
              }

              private fun drawScene() {
                  if (!holder.surface.isValid) return
                  val canvas: Canvas = holder.lockCanvas()
                  canvas.drawColor(Color.parseColor("#090d16"))

                  // ۱. گرید جهان بازی همراه با افست دوربین
                  paint.color = Color.parseColor("#1e293b")
                  paint.strokeWidth = 2f
                  for (i in -1000..3000 step 100) {
                      val screenX = i.toFloat() - cameraOffsetX
                      canvas.drawLine(screenX, 0f, screenX, 2000f, paint)
                  }
                  
                  paint.color = Color.parseColor("#22c55e")
                  paint.strokeWidth = 6f
                  canvas.drawLine(-1000f - cameraOffsetX, 600f, 3000f - cameraOffsetX, 600f, paint)

                  // ۲. رندر ذرات
                  for (p in particles) {
                      paint.color = Color.parseColor(p.colorHex)
                      paint.alpha = (p.life * 255).toInt().coerceIn(0, 255)
                      canvas.drawCircle(p.x - cameraOffsetX, p.y, 8f * p.life, paint)
                  }

                  // ۳. رندر اشیاء و کاراکتر اسکلتی موتور «پارس»
                  for (obj in objects) {
                      val renderX = obj.x - cameraOffsetX
                      val renderY = obj.y

                      if (obj.type == "player") {
                          drawSkeletalCharacter(canvas, renderX, renderY, obj)
                      } else {
                          // رسم اشیاء عادی
                          val width = 100f * obj.scaleX
                          val height = 100f * obj.scaleY
                          paint.color = Color.parseColor(if (obj.colorHex.startsWith("#")) obj.colorHex else "#ef4444")
                          paint.alpha = 255
                          canvas.drawRect(renderX, renderY, renderX + width, renderY + height, paint)
                      }
                  }
                  holder.unlockCanvasAndPost(canvas)
              }

              private fun drawSkeletalCharacter(canvas: Canvas, x: Float, y: Float, obj: GameObject3D) {
                  val legAngle = if (obj.isWalking) sin(obj.animFrame.toDouble()).toFloat() * 30f else 0f
                  val armAngle = if (obj.isWalking) sin((obj.animFrame + 3.14f).toDouble()).toFloat() * 25f else 0f

                  // ۱. سایه
                  paint.color = Color.BLACK
                  paint.alpha = 80
                  canvas.drawOval(x - 30f, 595f, x + 30f, 610f, paint)

                  // ۲. پاها (Legs)
                  paint.color = Color.parseColor("#1e293b")
                  paint.strokeWidth = 10f
                  paint.alpha = 255
                  // پای چپ
                  canvas.drawLine(x - 10f, y + 40f, x - 10f + legAngle, y + 90f, paint)
                  // پای راست
                  canvas.drawLine(x + 10f, y + 40f, x + 10f - legAngle, y + 90f, paint)

                  // ۳. تنه / بدن (Torso)
                  paint.color = Color.parseColor(obj.colorHex)
                  canvas.drawRect(x - 20f, y - 20f, x + 20f, y + 40f, paint)

                  // ۴. دست‌ها (Arms)
                  paint.color = Color.parseColor("#0284c7")
                  paint.strokeWidth = 8f
                  // دست چپ
                  canvas.drawLine(x - 20f, y - 10f, x - 35f - armAngle, y + 25f, paint)
                  // دست راست
                  canvas.drawLine(x + 20f, y - 10f, x + 35f + armAngle, y + 25f, paint)

                  // ۵. سر و چشم‌ها (Head & Eyes)
                  paint.color = Color.parseColor("#fde047")
                  canvas.drawCircle(x, y - 40f, 20f, paint)
                  // چشم‌ها
                  paint.color = Color.BLACK
                  canvas.drawCircle(x + 8f, y - 43f, 3f, paint)
                  canvas.drawCircle(x - 8f, y - 43f, 3f, paint)
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (isPlayMode) return true
                  val x = event.x + cameraOffsetX
                  val y = event.y

                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> {
                          selectedObject = objects.findLast { obj ->
                              x >= obj.x - 50f && x <= obj.x + 50f && y >= obj.y - 50f && y <= obj.y + 50f
                          }
                          lastTouchX = x
                          lastTouchY = y
                      }
                      MotionEvent.ACTION_MOVE -> {
                          selectedObject?.let { obj ->
                              obj.x += x - lastTouchX
                              obj.y += y - lastTouchY
                              lastTouchX = x
                              lastTouchY = y
                          }
                      }
                  }
                  return true
              }
          }
          EOF

          # ۵. رابط کاربری موتور پارس با کلیدهای حرکتی راه‌رفتن (MainActivity)
          cat << 'EOF' > app/src/main/java/com/persiangulf/gameengine/MainActivity.kt
          package com.persiangulf.gameengine

          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.MotionEvent
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import com.persiangulf.gameengine.engine.EngineViewport
          import com.persiangulf.gameengine.model.GameObject3D
          import com.persiangulf.gameengine.storage.ProjectStorage

          class MainActivity : AppCompatActivity() {
              private lateinit var storage: ProjectStorage
              private val gameObjects = mutableListOf<GameObject3D>()
              private lateinit var viewport: EngineViewport

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  storage = ProjectStorage(this)
                  val loaded = storage.loadProject()
                  if (loaded.isEmpty()) {
                      gameObjects.add(GameObject3D("1", "SkeletalPlayer", "player", 200f, 500f, 0f, 1f, 1f, 1f, "#38bdf8", "solid", false))
                      gameObjects.add(GameObject3D("2", "Monster", "enemy", 700f, 500f, 0f, 1.2f, 1.2f, 1f, "#ef4444", "solid", true))
                      storage.saveProject(gameObjects)
                  } else {
                      gameObjects.addAll(loaded)
                  }

                  val mainLayout = FrameLayout(this)
                  viewport = EngineViewport(this, gameObjects)
                  mainLayout.addView(viewport)

                  // نوار ابزار اصلی موتور «پارس»
                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#cc0f172a"))
                      setPadding(15, 15, 15, 15)
                  }

                  val btnAdd = Button(this).apply { text = "+ دشمن جدید"; setOnClickListener { addNewObject() } }
                  val btnMode = Button(this).apply {
                      text = "▶ تست بازی"
                      setOnClickListener {
                          viewport.isPlayMode = !viewport.isPlayMode
                          text = if (viewport.isPlayMode) "⏸ حالت ویرایش" else "▶ تست بازی"
                      }
                  }

                  topBar.addView(btnAdd)
                  topBar.addView(btnMode)

                  val topParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT)
                  topParams.gravity = Gravity.TOP
                  mainLayout.addView(topBar, topParams)

                  // دکمه‌های حرکت انیمیشنی به چپ و راست
                  val controllerLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }

                  val btnLeft = Button(this).apply { text = "◀ چپ" }
                  btnLeft.setOnTouchListener { _, event ->
                      if (event.action == MotionEvent.ACTION_MOVE || event.action == MotionEvent.ACTION_DOWN) {
                          viewport.movePlayer(-1f)
                      } else if (event.action == MotionEvent.ACTION_UP) {
                          viewport.stopPlayer()
                      }
                      true
                  }

                  val btnRight = Button(this).apply { text = "راست ▶" }
                  btnRight.setOnTouchListener { _, event ->
                      if (event.action == MotionEvent.ACTION_MOVE || event.action == MotionEvent.ACTION_DOWN) {
                          viewport.movePlayer(1f)
                      } else if (event.action == MotionEvent.ACTION_UP) {
                          viewport.stopPlayer()
                      }
                      true
                  }

                  controllerLayout.addView(btnLeft)
                  controllerLayout.addView(btnRight)

                  val ctrlParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT).apply {
                      gravity = Gravity.BOTTOM or Gravity.LEFT
                      setMargins(30, 0, 0, 30)
                  }
                  mainLayout.addView(controllerLayout, ctrlParams)

                  setContentView(mainLayout)
              }

              private fun addNewObject() {
                  val newObj = GameObject3D(
                      id = System.currentTimeMillis().toString(),
                      name = "Enemy_${gameObjects.size}",
                      type = "enemy",
                      x = (500..1200).random().toFloat(),
                      y = 500f,
                      colorHex = "#ef4444"
                  )
                  gameObjects.add(newObj)
                  storage.saveProject(gameObjects)
                  Toast.makeText(this, "دشمن جدید اضافه شد!", Toast.LENGTH_SHORT).show()
              }

              override fun onPause() {
                  super.onPause()
                  storage.saveProject(gameObjects)
              }
          }
          EOF

          # ۶. مانیفست و تنظیمات build.gradle
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.persiangulf.gameengine">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Pars Game Engine 3D"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '7.4.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.0' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              compileSdk 33
              defaultConfig {
                  applicationId "com.persiangulf.gameengine"
                  minSdk 23
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
              kotlinOptions { jvmTarget = '1.8' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
              implementation 'com.google.code.gson:gson:2.9.1'
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParsEngine3D-Module4
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Upgrade Pars Engine Module 4: Skeletal Rigging, Walking Animation & Camera Tracking" || echo "No changes"
          git push
